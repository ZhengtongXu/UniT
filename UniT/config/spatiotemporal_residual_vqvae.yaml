# Spatiotemporal Residual VQ-VAE 训练配置
# ==========================================
# "Feeling the Unexpected" (感受那份意外)
#
# 核心理念:
# - Prophet预测"预期的平滑物理趋势"
# - Residual捕捉"意外事件" (碰撞、打滑等)
# - VQ将连续的意外信号压缩成离散的Event Code
# - Dynamic FiLM Decoder使用Event Code调制解码

_target_: UniT.workspace.train_spatiotemporal_workspace.TrainSpatiotemporalWorkspace

defaults:
  - _self_

# ====================
# 训练参数
# ====================
name: spatiotemporal_residual_vqvae
seed: 42
base_learning_rate: 4.5e-6
batch_size: 2  # 视频数据显存占用大，进一步减小batch size (从4降至2)
max_epochs: 150
gpus: "0"

# ====================
# 模型配置
# ====================
model:
  # Prophet配置 (Causal TCN)
  prophet_config:
    visual_backbone: resnet18
    visual_pretrained: true
    state_dim: 8
    action_dim: 8
    latent_dim: 256
    seq_length: 16
    tcn_layers: 3

  # Observation Encoder配置 (TimeDistributed 2D VAE)
  obs_encoder_ckpt: null  # 如有预训练模型，填入路径
  obs_encoder_config:
    latent_dim: 256
    spatial_size: [16, 20]  # 与decoder spatial_size一致
    z_channels: 3

  # Residual Aggregator配置 (Transformer)
  residual_config:
    latent_dim: 256
    num_heads: 4
    num_layers: 2
    ff_dim: 512

  # VQ配置
  vq_config:
    n_e: 512      # Event codebook size
    e_dim: 256    # Event embedding dim
    beta: 0.25    # Commitment loss weight

  # Decoder配置 (Dynamic FiLM)
  decoder_config:
    latent_dim: 256
    event_dim: 256
    seq_length: 16
    spatial_size: [16, 20]
    out_channels: 3

  # 损失权重 (会被课程学习动态调整)
  lambda_sparse: 0.01
  aux_loss_weight: 1.0      # Stage 1初始值
  hybrid_loss_weight: 0.0   # Stage 1初始值

# ====================
# 数据集配置
# ====================
dataset:
  dataset_path: data/residual_tactile_train_v2
  seq_length: 16
  visual_size: [224, 224]
  tactile_size: [128, 160]
  normalize_robot_state: true
  val_ratio: 0.1
  seed: ${seed}

# ====================
# DataLoader配置
# ====================
dataloader:
  batch_size: ${batch_size}
  num_workers: 4
  persistent_workers: false
  pin_memory: true
  shuffle: true

val_dataloader:
  batch_size: ${batch_size}
  num_workers: 2
  persistent_workers: false
  pin_memory: true
  shuffle: false

# ====================
# Curriculum Learning (三阶段训练)
# ====================
curriculum_learning:
  enabled: true
  phases:
    # ========================================
    # STAGE 1 (0-40): 触觉重建 (不使用VQ调制)
    # ========================================
    # 目标: 训练Observation Encoder + Decoder基础重建
    # force_identity=True: FiLM层输出γ=1, β=0 (不调制)

    - end_epoch: 40
      force_identity: true        # 🔑 关键: 不使用VQ调制
      aux_loss_weight: 1.0        # 全力训练重建
      hybrid_loss_weight: 0.0     # 不使用Hybrid路径
      lambda_sparse: 0.0          # 暂不约束残差
      name: 'stage1_reconstruction'

    # ========================================
    # STAGE 2 (40-90): VQ训练 (开始学习Event Code)
    # ========================================
    # 目标: 训练Residual Aggregator + VQ学习事件码
    # force_identity=False: 开始使用VQ调制

    - end_epoch: 90
      force_identity: false       # 🔑 开始使用VQ调制
      aux_loss_weight: 0.5        # 保持Aux路径监督
      hybrid_loss_weight: 0.5     # 引入Hybrid路径
      lambda_sparse: 0.01         # 鼓励残差稀疏
      name: 'stage2_vq_training'

    # ========================================
    # STAGE 3 (90-150): FiLM Fine-tune (端到端优化)
    # ========================================
    # 目标: 端到端fine-tune，FiLM调制达到最优

    - end_epoch: 150
      force_identity: false       # 使用VQ调制
      aux_loss_weight: 0.0        # 🔥 完全依赖VQ路径
      hybrid_loss_weight: 1.0     # Hybrid Loss主导
      lambda_sparse: 0.005        # 弱稀疏约束
      name: 'stage3_film_finetune'

# ====================
# Validation & Logging
# ====================
validation:
  val_check_interval: 5
  video_log_interval: 10  # 视频可视化频率 (epoch)
  checkpoint_save_interval: 10
  keep_last_n_checkpoints: 5

# ====================
# Trainer配置
# ====================
trainer:
  name: ${name}
  project: spatiotemporal_residual_tactile
  train: true
  no_test: false
  postfix: ""
  save_every: 10
  resume: ""
  resume_from_checkpoint: null
  debug: false

# ====================
# 其他
# ====================
with_vq: true
datatype: 'spatiotemporal'
